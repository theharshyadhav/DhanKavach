 const d=`To,\nThe Compliance Officer / Grievance Cell\n${$("#en").value}\n\nSubject: Complaint regarding ${is.toLowerCase()}\n\nDate of incident: ${$("#dt").value||"[date]"}\nAmount involved: ₹${$("#am").value||"[amount]"}\nClient ID / folio: [your ID]\n\nDetails:\n${$("#tx").value||"[describe the sequence of events]"}\n\nI request a written resolution within the prescribed timeline. If unresolved, I will escalate through SEBI SCORES and, where applicable, the online dispute resolution route.\n\nEnclosures: statements, screenshots, call/email records.\n\nName: [your name]   Phone: [your number]`;
 $("#out").innerHTML=`<div class="t"><b>Your draft</b><pre id="dr"></pre><button class="btn" id="cp">${t("copy")}</button>
 <p><b>Your path</b></p><p class="s">1. Write to the entity first and keep proof of sending.<br>2. If unresolved or unsatisfactory, file on SEBI SCORES (scores.sebi.gov.in) with the same documents.<br>3. Explore online dispute resolution if still unresolved.<br>4. Never pay anyone who promises to "recover" your money.<br><i>Check the current timelines on the official sites.</i></p></div>`;
 $("#dr").textContent=d;$("#cp").onclick=()=>{try{navigator.clipboard.writeText(d);toast("Copied")}catch(e){toast("Select and copy")}};award(15,"comp")}}
const Q=[["A caller says he is from your broker and asks you to install a screen-share app to 'fix your account'. You…",["Install it, he knows my name","Refuse, hang up and call the broker's official number","Share only the OTP"],1,"Remote-access apps and OTPs are how accounts get emptied. Verify only via official channels."],
["Your late father held shares and you do not know where. What helps first?",["Nothing, they are lost","Look for demat statements, then contact the depository participant with the death certificate and legal-heir documents","Pay an agent for a 'fast claim'"],1,"There is a formal legal-heir process. Nominees on every account make it far simpler."],
["Dividends unclaimed for 7 years are moved to…",["The broker","IEPF (Investor Education and Protection Fund)","They vanish"],1,"You can still claim them from IEPF through the official process on iepf.gov.in."],
["Broker did not resolve your complaint. Where can you escalate?",["Social media only","SEBI SCORES, with your documents","Delete the app"],1,"SCORES is SEBI's official complaint system. Keep evidence organised."]];
function Quiz(i,sc){const b=$("#rb");if(i>=Q.length){if(sc>=3)award(sc*5,"rr");else award(sc*5);b.innerHTML=`<div class="t"><h2>${sc}/${Q.length} correct</h2><p class="s">Knowing your rights is the strongest shield.</p><button class="btn g" onclick="Quiz(0,0)">Retry</button></div>`;return}
 const q=Q[i];b.innerHTML=`<div class="t"><div class="stat"><span>Question ${i+1}/${Q.length}</span><span>Score ${sc}</span></div><p><b>${q[0]}</b></p>${q[1].map((o,j)=>`<button class="btn opt" data-j="${j}">${o}</button>`).join("")}<p id="ex" class="s"></p></div>`;
 b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const j=+o.dataset.j;b.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.querySelectorAll(".opt")[q[2]].classList.add("ok");if(j!=q[2])o.classList.add("no");$("#ex").innerHTML=q[3]+`<br><br><button class="btn g" id="nx">Next ▶</button>`;$("#nx").onclick=()=>Quiz(i+1,sc+(j==q[2]?1:0))})}
function Badges(){v.innerHTML=`<h2>🏅 Badges</h2><p class="s">${S.badges.length}/${Object.keys(BD).length} unlocked</p><div class="grid">${Object.entries(BD).map(([k,b])=>`<div class="t bdg ${S.badges.includes(k)?"":"lock"}">${b[0]}<small><b>${b[1]}</b><br>${b[2]}</small></div>`).join("")}</div>`}
go("home");
</script></body></html>
